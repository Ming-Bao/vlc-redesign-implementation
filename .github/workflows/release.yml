name: release

# Push a tag like v4.0.0-beta.1 to build Windows, macOS and Linux packages
# and publish them as a GitHub pre-release. Pushes to release/* branches only build.
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

defaults:
  run:
    shell: bash  # with pipefail, so tee keeps the build's status

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /
      - name: Build
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e VERSION --user root
          registry.videolan.org/vlc-debian-win64-posix:20260611225331
          sh -c 'git config --global --add safe.directory /src && extras/package/release/windows.sh /src/dist' 2>&1 | tee build.log
      - name: Log tail as annotation
        if: failure()
        run: |
          enc() { python3 -c "import sys;print(sys.stdin.read()[-3500:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          echo "::error title=build errors::$(grep -a -E 'error|Error|FAILED|No such|not found' build.log | tail -30 | enc)"
          echo "::error title=build log tail::$(tail -c 3500 build.log | enc)"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /
      - name: Build
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e VERSION --user root
          registry.videolan.org/vlc-debian-unstable:20260611225331
          sh -c 'git config --global --add safe.directory /src && extras/package/release/linux-appimage.sh /src/dist' 2>&1 | tee build.log
      - name: Log tail as annotation
        if: failure()
        run: |
          enc() { python3 -c "import sys;print(sys.stdin.read()[-3500:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          echo "::error title=build errors::$(grep -a -E 'error|Error|FAILED|No such|not found' build.log | tail -30 | enc)"
          echo "::error title=build log tail::$(tail -c 3500 build.log | enc)"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  macos:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: extras/package/release/macos.sh "$PWD/dist" 2>&1 | tee build.log
      - name: Log tail as annotation
        if: failure()
        run: |
          enc() { python3 -c "import sys;print(sys.stdin.read()[-3500:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; }
          echo "::error title=build errors::$(grep -a -E 'error|Error|FAILED|No such|not found' build.log | tail -30 | enc)"
          echo "::error title=build log tail::$(tail -c 3500 build.log | enc)"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: VLC Redesign ${{ github.ref_name }}
          files: dist/*
          body: |
            Beta build of the VLC redesign. Not signed: Windows SmartScreen and
            macOS Gatekeeper will warn (macOS: right-click the app, then Open).

            - **Windows 10/11 x64**: `*-win64.exe` installer (or the portable zip)
            - **macOS 12+ Apple Silicon**: `*-macos-arm64.dmg`
            - **Linux x86-64**: `*-x86_64.AppImage` (`chmod +x`, then run; needs a 2025+ distribution)

            To uninstall completely (app, settings, media library, caches): Windows
            *Settings ▸ Apps ▸ VLC Redesign*; macOS `Uninstall VLC Redesign.command`
            in the disk image; Linux `sh uninstall.sh path/to/the.AppImage`.
